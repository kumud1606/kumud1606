name: Update Profile

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 3 AM UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install Pillow

      - name: Regenerate heatmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_heatmap.py --user kumud1606 --output contrib-heatmap.svg

      - name: Regenerate info card
        run: python scripts/generate_info_card.py --output info-card.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg info-card.svg
          git diff --staged --quiet || git commit -m "chore: auto-refresh profile visuals"
          git push
